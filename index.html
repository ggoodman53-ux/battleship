<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battleship</title>
  <meta name="description" content="Play Battleship against a computer opponent in your browser.">
  <meta name="theme-color" content="#0b1726">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1726'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%234fc3f7' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23ff5a4e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="phase-setup">
  <header class="topbar">
    <h1 class="title"><span class="title-mark" aria-hidden="true"></span>Battleship</h1>
    <div class="controls">
      <label for="difficulty" class="control-label">Difficulty</label>
      <select id="difficulty" class="select">
        <option value="easy">Easy</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Hard</option>
      </select>
      <button type="button" id="new-game" class="btn">New Game</button>
    </div>
  </header>

  <main class="layout">
    <section class="status" aria-label="Game status">
      <span id="turn" class="turn-pill">Setup</span>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section id="banner" class="banner" hidden>
      <div>
        <h2 id="banner-title" class="banner-title"></h2>
        <p id="banner-text" class="banner-text"></p>
      </div>
      <button type="button" id="play-again" class="btn btn-primary">Play Again</button>
    </section>

    <section id="setup" class="setup" aria-labelledby="setup-title">
      <div class="setup-head">
        <h2 id="setup-title">Deploy your fleet</h2>
        <p class="hint">Select a ship, then click a cell on <strong>Your Fleet</strong>. Press <kbd>R</kbd> while on the grid, or use Rotate, to change direction.</p>
      </div>
      <div id="ship-picker" class="ship-picker" role="group" aria-label="Ships to place"></div>
      <div class="setup-actions">
        <button type="button" id="rotate" class="btn">Rotate: Horizontal</button>
        <button type="button" id="randomize" class="btn">Randomize</button>
        <button type="button" id="clear" class="btn btn-ghost">Clear</button>
        <button type="button" id="start" class="btn btn-primary" disabled>Start Game</button>
      </div>
    </section>

    <div class="boards">
      <section class="board-panel player-panel" aria-labelledby="player-title">
        <div class="board-head">
          <h2 id="player-title">Your Fleet</h2>
          <span class="afloat"><span id="player-count">5</span> of 5 afloat</span>
        </div>
        <div id="player-grid" class="grid" role="group" aria-label="Your Fleet grid"></div>
        <ul id="player-ships" class="ship-list" aria-label="Your ships"></ul>
      </section>

      <section class="board-panel enemy-panel" aria-labelledby="enemy-title">
        <div class="board-head">
          <h2 id="enemy-title">Enemy Waters</h2>
          <span class="afloat"><span id="enemy-count">5</span> of 5 afloat</span>
        </div>
        <div id="enemy-grid" class="grid" role="group" aria-label="Enemy Waters grid"></div>
        <ul id="enemy-ships" class="ship-list" aria-label="Enemy ships"></ul>
      </section>
    </div>

    <section class="log-panel" aria-labelledby="log-title">
      <h2 id="log-title">Battle log</h2>
      <ol id="log" class="log"></ol>
    </section>

    <section class="legend" aria-label="Legend">
      <span class="legend-item"><span class="swatch swatch-ship"></span>Ship</span>
      <span class="legend-item"><span class="swatch swatch-miss"></span>Miss</span>
      <span class="legend-item"><span class="swatch swatch-hit"></span>Hit</span>
      <span class="legend-item"><span class="swatch swatch-sunk"></span>Sunk</span>
    </section>
  </main>

  <script src="js/game.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
